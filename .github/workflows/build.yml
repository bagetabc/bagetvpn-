name: BagetVPN IPA Build - Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout BagetVPN
        uses: actions/checkout@v4

      - name: Checkout Apple client
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-apple
          ref: dev
          path: sing-box-for-apple
          submodules: recursive
          fetch-depth: 0

      - name: Initialize Runestone
        working-directory: sing-box-for-apple
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
          test -f Frameworks/Runestone/Package.swift

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s \
              /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: testing
          path: sing-box-core
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box-core/go.mod
          cache-dependency-path: sing-box-core/go.sum

      - name: Install Go mobile tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Libbox framework
        working-directory: sing-box-core
        run: |
          go run ./cmd/internal/build_libbox \
            -target apple \
            -platform ios,iossimulator

      - name: Verify Libbox
        run: |
          test -d sing-box-for-apple/Libbox.xcframework
          echo "Libbox framework found"

      - name: Resolve Swift packages
        working-directory: sing-box-for-apple
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -scheme SFI

      - name: Build iOS app
        working-directory: sing-box-for-apple
        run: |
          xcodebuild \
            -scheme SFI \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="sing-box-for-apple/build/DerivedData/Build/Products/Debug-iphoneos/SFI.app"
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/BagetVPN.app
          cd dist
          zip -r BagetVPN-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BagetVPN-unsigned-IPA
          path: dist/BagetVPN-unsigned.ipa
          if-no-files-found: error
