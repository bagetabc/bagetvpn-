name: Build BagetVPN IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout BagetVPN
        uses: actions/checkout@v4

      - name: Checkout sing-box-for-apple
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-apple
          ref: dev
          path: sing-box-for-apple
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s \
            /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Check project files
        working-directory: sing-box-for-apple
        run: |
          git submodule status --recursive
          ls -la Frameworks/Runestone
          test -f Frameworks/Runestone/Package.swift

      - name: Build iOS app
        working-directory: sing-box-for-apple
        run: |
          xcodebuild \
            -scheme SFI \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        if: success()
        run: |
          APP="sing-box-for-apple/build/DerivedData/Build/Products/Debug-iphoneos/SFI.app"
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/BagetVPN.app
          cd dist
          zip -r BagetVPN-unsigned.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BagetVPN-unsigned-IPA
          path: dist/BagetVPN-unsigned.ipa
          if-no-files-found: error
